name: atlas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  js-python-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build content and validate citations
        run: python3 scripts/build_content.py
      - name: Translation structure check
        run: python3 scripts/check_translations.py
      - name: Prose claim verification
        run: python3 scripts/verify_claims.py
      - name: JavaScript suite
        run: node --test tests/js/*.test.js
      - name: Python suite
        run: PYTHONPATH=lib/python python3 -m unittest discover -s lib/python/tests -v
      - name: Cross-language parity runner
        run: make parity-check
      - name: Algorithm parity runner
        run: python3 scripts/parity_algorithms.py
      - name: Reference audit (schema)
        run: python3 scripts/verify_references.py --offline
      - name: Python package build
        run: |
          python3 -m pip install build
          cd lib/python && python3 -m build --wheel --sdist --outdir ../../dist
      - name: API smoke test
        run: |
          PYTHONPATH=lib/python python3 -m percolation_atlas serve --port 8099 &
          sleep 1
          curl -fsS http://127.0.0.1:8099/api/health
          curl -fsS -X POST http://127.0.0.1:8099/api/bootstrap -H 'Content-Type: application/json' -d '{"L":32,"p":0.5,"r":3,"seed":11}'
      - name: C++ suite
        run: make -C lib/cpp test
      - name: Benchmark smoke test
        run: |
          make bench
          python3 -c "import json; d=json.load(open('data/raw_bench.json')); assert d['crossing'] and d['interdependent']['points']; print('bench ok')"

  julia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
      - name: Julia suite
        run: julia --startup-file=no --project=lib/julia lib/julia/test/runtests.jl
