[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "percolation-atlas"
version = "2.0.0"
description = "Reference percolation algorithms (shared RNG with the C++, Julia and JavaScript editions)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Atlas Percolation contributors" }]
keywords = ["percolation", "statistical-physics", "networks", "monte-carlo"]

[tool.setuptools]
packages = ["percolation_atlas"]
