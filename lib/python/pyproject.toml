[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "percolation-atlas"
version = "3.1.1"
description = "Reference percolation algorithms and a reproducible algorithm package: Bernoulli, Newman-Ziff, Leath, bootstrap, invasion and Achlioptas processes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Atlas Percolation contributors" }]
keywords = ["percolation", "statistical-physics", "networks", "monte-carlo", "bootstrap", "invasion-percolation"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Mathematics",
]
[project.urls]
Homepage = "https://cxy2696.github.io/atlas-percolation/"
Repository = "https://github.com/cxy2696/atlas-percolation"
Documentation = "https://github.com/cxy2696/atlas-percolation/blob/main/docs/API.md"

[project.scripts]
atlas-perc = "percolation_atlas.cli:main"

[project.optional-dependencies]
dev = ["build>=1.2"]

[tool.setuptools]
packages = ["percolation_atlas"]
